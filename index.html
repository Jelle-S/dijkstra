<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijkstra Visualization with D3.js</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    background-color: white;
    color: black;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.5rem, 6vw, 2rem);
  }
  .board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    width: 100%;
    margin-top: 20px;
  }
  #svgContainer {
    flex: 1 1 320px;
    max-width: 690px;
  }
  #queue {
    flex: 0 0 220px;
    position: relative;
    border: 1px solid black;
    font-family: monospace;
    font-size: 13px;
    text-align: left;
  }
  /* Absolutely positioned so the list scrolls within the maze's height */
  #queue .inner {
    position: absolute;
    inset: 0;
    overflow: auto;
    padding: 8px;
  }
  #queue .qhead {
    font-weight: bold;
    margin-bottom: 4px;
  }
  #queue .popped {
    background: #3b82f6;
    color: white;
    padding: 2px 4px;
  }
  #queue ol {
    list-style: none;
    margin: 4px 0;
    padding: 0;
  }
  #queue li {
    padding: 1px 4px;
  }
  #queue li.fresh {
    background: #bfdbfe;
  }
  #queue .mud {
    color: #4a3b1f;
  }
  #queue .hint {
    color: #666;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid black;
    box-sizing: border-box;
  }
  button, input {
    font-size: 16px; /* 16px stops iOS from zooming in on focus */
    touch-action: manipulation;
  }
  button {
    padding: 8px 14px;
  }
  #size {
    width: 4em;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  #stats {
    font-family: monospace;
    margin-top: 12px;
    min-height: 1.4em;
    overflow-wrap: anywhere;
  }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
    font-size: 13px;
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 6px;
    vertical-align: -1px;
    border: 1px solid black;
    background: var(--c);
  }
  .legend .note::before {
    display: none;
  }
  @media (max-width: 600px) {
    body {
      padding: 16px;
    }
    .legend {
      gap: 8px 12px;
    }
    #queue {
      flex: 1 1 100%;
    }
    #queue .inner {
      position: static;
      max-height: 240px;
    }
  }
</style>
</head>
<body>

<h1>Dijkstra Visualization</h1>
<p>A maze with loops (so more than one route exists) and "mud" cells that cost 5 instead of 1.</p>

<div class="controls">
  <label>Grid size <input type="number" id="size" min="5" max="60" value="10"></label>
  <button id="newButton">New maze</button>
  <button id="startButton">Start Dijkstra</button>
  <label>Speed <input type="range" id="speed" min="1" max="60" value="1"></label>
</div>

<div id="stats"></div>

<div class="legend">
  <span style="--c:black">Wall</span>
  <span style="--c:#4a3b1f">Mud (cost 5)</span>
  <span style="--c:#3b82f6">Route being calculated</span>
  <span style="--c:#bfdbfe">In queue</span>
  <span style="--c:red">Shortest path</span>
  <span style="--c:orange">Alternative route</span>
  <span class="note">Darker shade: through mud</span>
</div>

<div class="board">
  <div id="svgContainer"></div>
  <div id="queue"><div class="inner"></div></div>
</div>

<script>
// Minimal binary min-heap of [priority, seq, value]. Ties on priority are
// broken by seq (insertion order), so the pop order is fully predictable.
const less = (x, y) => x[0] < y[0] || (x[0] === y[0] && x[1] < y[1]);

class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item) {
    const a = this.a;
    a.push(item);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (!less(a[i], a[p])) break;
      [a[p], a[i]] = [a[i], a[p]];
      i = p;
    }
  }
  pop() {
    const a = this.a;
    const top = a[0];
    const last = a.pop();
    if (a.length > 0) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1;
        let m = i;
        if (l < a.length && less(a[l], a[m])) m = l;
        if (r < a.length && less(a[r], a[m])) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]];
        i = m;
      }
    }
    return top;
  }
}

class DijkstraVisualizer {
  constructor(mazeCells, cellSize) {
    this.mazeCells = mazeCells;                 // logical maze is mazeCells x mazeCells
    this.n = mazeCells * 2 + 1;                 // grid is n x n including wall cells
    this.cellSize = cellSize;
    this.runId = 0;
    this.generateMaze();
    this.start = 1 * this.n + 1;
    this.end = (this.n - 2) * this.n + (this.n - 2);
  }

  idx(r, c) { return r * this.n + c; }

  generateMaze() {
    const n = this.n;
    const wall = new Uint8Array(n * n).fill(1);
    const visited = new Set();
    const stack = [[1, 1]];
    wall[this.idx(1, 1)] = 0;
    visited.add(this.idx(1, 1));

    // Recursive backtracker -> a perfect maze (exactly 1 solution)
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const options = [[-2, 0], [2, 0], [0, -2], [0, 2]]
        .map(([dr, dc]) => [r + dr, c + dc, dr, dc])
        .filter(([nr, nc]) => nr > 0 && nc > 0 && nr < n - 1 && nc < n - 1 && !visited.has(this.idx(nr, nc)));
      if (options.length === 0) { stack.pop(); continue; }
      const [nr, nc, dr, dc] = options[Math.floor(Math.random() * options.length)];
      wall[this.idx(r + dr / 2, c + dc / 2)] = 0;
      wall[this.idx(nr, nc)] = 0;
      visited.add(this.idx(nr, nc));
      stack.push([nr, nc]);
    }

    // Knock out extra walls -> loops -> multiple solutions
    const candidates = [];
    for (let r = 1; r < n - 1; r++) {
      for (let c = 1; c < n - 1; c++) {
        if (!wall[this.idx(r, c)]) continue;
        const horizontal = r % 2 === 1 && c % 2 === 0 && !wall[this.idx(r, c - 1)] && !wall[this.idx(r, c + 1)];
        const vertical = r % 2 === 0 && c % 2 === 1 && !wall[this.idx(r - 1, c)] && !wall[this.idx(r + 1, c)];
        if (horizontal || vertical) candidates.push(this.idx(r, c));
      }
    }
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    const loops = Math.floor(this.mazeCells * this.mazeCells * 0.12);
    for (let i = 0; i < loops && i < candidates.length; i++) wall[candidates[i]] = 0;

    // Mud patches: stepping on them costs 5 instead of 1
    const cost = new Uint8Array(n * n).fill(1);
    // Keep mud coverage roughly constant: 7 patches on a 21x21 maze
    const patches = Math.max(1, Math.round(7 * (this.mazeCells / 21) ** 2));
    for (let p = 0; p < patches; p++) {
      const pr = 1 + Math.floor(Math.random() * (n - 2));
      const pc = 1 + Math.floor(Math.random() * (n - 2));
      const radius = 3 + Math.floor(Math.random() * 4);
      for (let r = Math.max(1, pr - radius); r <= Math.min(n - 2, pr + radius); r++) {
        for (let c = Math.max(1, pc - radius); c <= Math.min(n - 2, pc + radius); c++) {
          if ((r - pr) ** 2 + (c - pc) ** 2 <= radius * radius && !wall[this.idx(r, c)]) {
            cost[this.idx(r, c)] = 5;
          }
        }
      }
    }
    cost[this.idx(1, 1)] = 1;
    cost[this.idx(n - 2, n - 2)] = 1;

    this.wall = wall;
    this.cost = cost;
  }

  neighbors(i) {
    const n = this.n;
    const r = Math.floor(i / n), c = i % n;
    const out = [];
    if (r > 0 && !this.wall[i - n]) out.push(i - n);
    if (r < n - 1 && !this.wall[i + n]) out.push(i + n);
    if (c > 0 && !this.wall[i - 1]) out.push(i - 1);
    if (c < n - 1 && !this.wall[i + 1]) out.push(i + 1);
    return out;
  }

  // Dijkstra. Optionally records events for the animation.
  dijkstra(extraCost = null, record = false) {
    const size = this.n * this.n;
    const dist = new Float64Array(size).fill(Infinity);
    const prev = new Int32Array(size).fill(-1);
    const ways = new Float64Array(size);
    const done = new Uint8Array(size);
    const events = [];
    const heap = new MinHeap();
    let seq = 0;

    dist[this.start] = 0;
    ways[this.start] = 1;
    heap.push([0, seq++, this.start]);

    while (heap.size > 0) {
      const [d, , u] = heap.pop();
      if (done[u]) continue;
      done[u] = 1;
      // Each event is one pop plus the inserts / decrease-keys that follow it
      const event = { i: u, d, p: prev[u], pushes: [] };
      if (record) events.push(event);
      if (u === this.end) break;

      for (const v of this.neighbors(u)) {
        if (done[v]) continue;
        const nd = d + this.cost[v] + (extraCost ? extraCost[v] : 0);
        if (nd < dist[v]) {
          event.pushes.push({ i: v, d: nd, seq, old: dist[v] });
          dist[v] = nd;
          prev[v] = u;
          ways[v] = ways[u];
          heap.push([nd, seq++, v]);
        } else if (nd === dist[v]) {
          ways[v] += ways[u];
        }
      }
    }

    const path = [];
    if (done[this.end]) {
      for (let at = this.end; at !== -1; at = prev[at]) path.push(at);
      path.reverse();
    }
    return { dist, prev, ways, events, path };
  }

  initGrid() {
    const n = this.n, cs = this.cellSize;
    this.cells = Array.from({ length: n * n }, (_, i) => ({ i, row: Math.floor(i / n), col: i % n }));
    this.state = new Array(n * n).fill("empty"); // empty | route | path | alt
    this.queued = new Map();
    this.renderQueue();

    d3.select("#svgContainer").selectAll("*").remove();
    const svg = d3.select("#svgContainer")
      .append("svg")
      .attr("viewBox", `0 0 ${n * cs} ${n * cs}`)
      .attr("width", n * cs)
      .attr("height", n * cs);

    this.rects = svg.selectAll("rect")
      .data(this.cells, d => d.i)
      .enter()
      .append("rect")
      .attr("x", d => d.col * cs)
      .attr("y", d => d.row * cs)
      .attr("width", cs)
      .attr("height", cs)
      .attr("stroke", "black")
      .attr("fill", d => this.color(d.i));
    this.svg = svg;
  }

  color(i) {
    if (i === this.start) return "#ffd700";
    if (i === this.end) return "#ff00ff";
    if (this.wall[i]) return "black";
    const mud = this.cost[i] > 1;
    switch (this.state[i]) {
      case "path": return mud ? "#8b0000" : "red";
      case "alt": return mud ? "#b45309" : "orange";
      case "route": return mud ? "#1e3a8a" : "#3b82f6";
      default:
        if (this.queued.has(i)) return mud ? "#6b8fc4" : "#bfdbfe";
        return mud ? "#4a3b1f" : "white";
    }
  }

  paint(indices) {
    const set = new Set(indices);
    this.rects
      .filter(d => set.has(d.i))
      .attr("fill", d => this.color(d.i));
  }

  paintAll() {
    this.rects.attr("fill", d => this.color(d.i));
  }

  reset() {
    this.runId++;
    this.state.fill("empty");
    this.queued = new Map();
    this.paintAll();
    this.renderQueue();
    document.getElementById("stats").textContent = "";
  }

  // Lists the priority queue as in the textbook algorithm: one entry per cell
  // with its current tentative distance, sorted by (distance, insertion order).
  renderQueue(popped = null, fresh = new Set(), finished = false) {
    const el = document.querySelector("#queue .inner");
    if (!popped) {
      el.innerHTML = '<div class="qhead">Queue</div><div class="hint">Press "Start Dijkstra"</div>';
      return;
    }
    const n = this.n, limit = 50;
    const cell = i => `(${Math.floor(i / n)},${i % n})` + (this.cost[i] > 1 ? ' <span class="mud">mud</span>' : "");
    const sorted = [...this.queued].sort((a, b) => a[1].d - b[1].d || a[1].seq - b[1].seq);
    const rows = sorted.slice(0, limit).map(([i, e]) => {
      const was = fresh.has(i) && e.old !== Infinity ? ` (was ${e.old})` : "";
      return `<li class="${fresh.has(i) ? "fresh" : ""}"><b>${e.d}</b>${was} ${cell(i)}</li>`;
    });
    el.innerHTML =
      `<div class="qhead">Queue (${this.queued.size})</div>` +
      `<div class="popped">${finished ? "Reached the end" : "Popped"}: <b>${popped.d}</b> ${cell(popped.i)}</div>` +
      `<ol>${rows.join("")}</ol>` +
      (sorted.length > limit ? `<div class="hint">… ${sorted.length - limit} more</div>` : "");
  }

  play() {
    this.reset();
    const myRun = this.runId;

    const main = this.dijkstra(null, true);

    // Alternative route: same maze, but heavily discourage reusing the shortest path
    const penalty = new Float64Array(this.n * this.n);
    for (const i of main.path) penalty[i] = 25;
    penalty[this.start] = 0;
    penalty[this.end] = 0;
    const alt = this.dijkstra(penalty, false);

    const events = main.events;
    const prev = new Int32Array(this.n * this.n).fill(-1);
    let pos = 0, route = [];
    const statsEl = document.getElementById("stats");
    this.queued = new Map([[this.start, { d: 0, seq: 0, old: Infinity }]]);

    const step = () => {
      if (myRun !== this.runId) return;
      const perTick = +document.getElementById("speed").value;
      const queueChanged = [], fresh = new Set();
      for (let k = 0; k < perTick && pos < events.length; k++, pos++) {
        const e = events[pos];
        prev[e.i] = e.p;
        this.queued.delete(e.i);
        queueChanged.push(e.i);
        for (const q of e.pushes) {
          this.queued.set(q.i, { d: q.d, seq: q.seq, old: q.old });
          fresh.add(q.i);
          queueChanged.push(q.i);
        }
      }
      const current = events[pos - 1];

      // Only show the route from the start to the node settled in this step
      const changed = route;
      for (const i of route) this.state[i] = "empty";
      route = [];
      for (let at = current.i; at !== -1; at = prev[at]) route.push(at);
      for (const i of route) this.state[i] = "route";
      this.paint([...changed, ...route, ...queueChanged]);
      this.renderQueue(current, fresh, pos === events.length);
      statsEl.textContent = `Settled: ${pos}   |   Current distance: ${current.d}`;

      if (pos < events.length) {
        // Low speeds also get a longer delay: 250ms per step at 1, 10ms from 5 up
        setTimeout(step, Math.max(10, 250 / perTick ** 2));
      } else {
        // Clear the queue tint so the final paths stand out; the list stays
        const left = [...this.queued.keys()];
        this.queued = new Map();
        for (const i of route) this.state[i] = "empty";
        this.paint([...route, ...left]);
        this.revealPath(main, alt, myRun);
      }
    };
    step();
  }

  revealPath(main, alt, myRun) {
    const statsEl = document.getElementById("stats");
    const mainSet = new Set(main.path);
    const altOnly = alt.path.filter(i => !mainSet.has(i));
    const sequence = [
      ...main.path.map(i => ["path", i]),
      ...altOnly.map(i => ["alt", i])
    ];
    let k = 0;

    const tick = () => {
      if (myRun !== this.runId) return;
      const batch = [];
      for (let b = 0; b < 3 && k < sequence.length; b++, k++) {
        const [s, i] = sequence[k];
        this.state[i] = s;
        batch.push(i);
      }
      this.paint(batch);
      if (k < sequence.length) {
        setTimeout(tick, 12);
      } else {
        const shortestCost = main.dist[this.end];
        const altCost = alt.path.reduce((s, i) => s + this.cost[i], 0) - this.cost[this.start];
        const count = main.ways[this.end];
        statsEl.textContent =
          `Shortest cost: ${shortestCost}  |  ${count} route${count === 1 ? "" : "s"} with that cost  |  ` +
          `alternative route: cost ${altCost} (${altOnly.length} cells differ)`;
      }
    };
    tick();
  }
}

let visualizer = null;

function newMaze() {
  if (visualizer) visualizer.runId++;
  const input = document.getElementById("size");
  const size = Math.min(+input.max, Math.max(+input.min, Math.round(+input.value) || 10));
  input.value = size;
  // Keep the board around 688px wide, whatever the grid size
  const cellSize = Math.max(4, Math.floor(688 / (size * 2 + 1)));
  visualizer = new DijkstraVisualizer(size, cellSize);
  visualizer.initGrid();
  document.getElementById("stats").textContent = "";
}

document.getElementById("newButton").addEventListener("click", newMaze);
document.getElementById("size").addEventListener("change", newMaze);
document.getElementById("startButton").addEventListener("click", () => visualizer.play());

newMaze();
</script>

</body>
</html>
